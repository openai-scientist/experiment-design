[project]
name = "experiment-design"
version = "0.1.0"
description = "Agent-assisted scientific experiment design"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "pyyaml>=6", "python-dotenv>=1.0", "typesafe-sdk"]

[project.scripts]
exd = "experiment_design.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_design"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["experiment_design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls a real LLM or JEV; needs keys; opt-in"]
xfail_strict = true
