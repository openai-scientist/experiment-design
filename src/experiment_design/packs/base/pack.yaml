min_benchmarks: 1
min_baselines: 2
calculators: [independent_pooled_t, cluster_equal_size_t]
validators: [seed_policy, equal_compute]
role_addenda:
  design: >-
    Give each experiment its own heading ## Experiment E<n>: <title>.
    Map every hypothesis to its experiments and prespecified decision rules.
    State interpretations for positive, negative and inconclusive outcomes without
    inventing results. Prefer datasets with identifiable provenance; explain when
    no dataset is appropriate. Disclose unknown quantities and resource shortfalls.
    Use the approved resources document: take datasets, benchmarks and baselines from
    it and list each shortfall under Limitations.
rubric:
  - category: leakage
    check: Check separation of training, tuning and evaluation data and possible contamination.
  - category: baseline
    check: Check relevant baselines, their provenance and fairness of the comparison.
  - category: control
    check: Check controls, confounding and comparable compute and measurement conditions.
  - category: statistics
    check: Check units, uncertainty, assumptions, multiplicity and prespecified decision rules.
  - category: reproducibility
    check: Check seeds, versions, executable procedures and exact recording of measurements.
